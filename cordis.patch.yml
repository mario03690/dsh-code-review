# dsh-code-review — DSH plugin by the ainetcafe.com team. Tools register as mcp__netcafe_review__<name>.
- insert:
    - id: mcp-dsh-code-review
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: netcafe-review
        transport: streamable-http
        url: https://ainetcafe.com/mcp/review?s=dsh-dsh-code-review
